<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WORDLY - تعلم المفردات الإنجليزية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #070B14;
      color: #F8FAFC;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0D1424; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #2563EB; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- IndexedDB Persistent Storage Engine ---
    const DB_NAME = 'WordlyDB';
    const DB_VERSION = 1;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('vocabulary')) {
            db.createObjectStore('vocabulary', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('sessions')) {
            db.createObjectStore('sessions', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('reviews')) {
            db.createObjectStore('reviews', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('settings')) {
            db.createObjectStore('settings', { keyPath: 'key' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbGetAll(storeName) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const store = tx.objectStore(storeName);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbPut(storeName, item) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        const store = tx.objectStore(storeName);
        const req = store.put(item);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbDelete(storeName, id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        const store = tx.objectStore(storeName);
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    async function dbClear(storeName) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        const store = tx.objectStore(storeName);
        const req = store.clear();
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    // --- Helper Functions ---
    const getTodayStr = () => new Date().toISOString().split('T')[0];

    const addDays = (dateStr, days) => {
      const d = new Date(dateStr);
      d.setDate(d.getDate() + days);
      return d.toISOString().split('T')[0];
    };

    const speakWord = (text) => {
      if (!window.speechSynthesis || !text) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.rate = 0.9;
      window.speechSynthesis.speak(utter);
    };

    // --- Main Application ---
    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [loading, setLoading] = useState(true);
      const [vocab, setVocab] = useState([]);
      const [sessions, setSessions] = useState([]);
      const [reviews, setReviews] = useState([]);
      const [settings, setSettings] = useState({
        dailyTarget: 5,
        lang: 'ar',
        streak: 0,
        lastActiveDate: ''
      });

      // Add / Edit Modal State
      const [showModal, setShowModal] = useState(false);
      const [editingWord, setEditingWord] = useState(null);
      const [formError, setFormError] = useState('');
      const [formData, setFormData] = useState({
        english: '',
        arabic: '',
        pronunciation: '',
        example: '',
        translation: '',
        category: '',
        notes: ''
      });

      // Learn Session State
      const [learnQueue, setLearnQueue] = useState([]);
      const [learnIdx, setLearnIdx] = useState(0);
      const [showTranslation, setShowTranslation] = useState(false);
      const [sessionResults, setSessionResults] = useState([]);
      const [sessionFinished, setSessionFinished] = useState(false);

      // Review Session State
      const [reviewIdx, setReviewIdx] = useState(0);
      const [revealAnswer, setRevealAnswer] = useState(false);
      const [reviewDone, setReviewDone] = useState(false);

      // Vocabulary Filter/Sort State
      const [searchQuery, setSearchQuery] = useState('');
      const [filterStatus, setFilterStatus] = useState('all');
      const [sortBy, setSortBy] = useState('newest');
      const [selectedWordDetail, setSelectedWordDetail] = useState(null);

      // Load Initial Data from IndexedDB
      useEffect(() => {
        async function init() {
          try {
            const [vData, sData, rData, stData] = await Promise.all([
              dbGetAll('vocabulary'),
              dbGetAll('sessions'),
              dbGetAll('reviews'),
              dbGetAll('settings')
            ]);
            setVocab(vData);
            setSessions(sData);
            setReviews(rData);

            const savedSettings = stData.find(x => x.key === 'user_settings');
            if (savedSettings && savedSettings.value) {
              setSettings(savedSettings.value);
            }
          } catch (err) {
            console.error('Database Error:', err);
          } finally {
            setLoading(false);
          }
        }
        init();
      }, []);

      // Update Settings & Direction
      useEffect(() => {
        document.documentElement.dir = settings.lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = settings.lang;
      }, [settings.lang]);

      const updateSettings = async (newFields) => {
        const updated = { ...settings, ...newFields };
        setSettings(updated);
        await dbPut('settings', { key: 'user_settings', value: updated });
      };

      const recordActivityStreak = async () => {
        const today = getTodayStr();
        const yesterday = addDays(today, -1);
        if (settings.lastActiveDate === today) return;

        const newStreak = settings.lastActiveDate === yesterday ? (settings.streak || 0) + 1 : 1;
        await updateSettings({ streak: newStreak, lastActiveDate: today });
      };

      // Computed Metrics
      const today = getTodayStr();
      const dueWords = useMemo(() => {
        return vocab.filter(w => w.nextReviewDate && w.nextReviewDate <= today);
      }, [vocab, today]);

      const masteredWords = useMemo(() => {
        return vocab.filter(w => (w.interval || 0) >= 14 || w.status === 'mastered');
      }, [vocab]);

      const todayLearnedCount = useMemo(() => {
        return sessions
          .filter(s => s.date === today)
          .reduce((acc, s) => acc + (s.wordsCount || 0), 0);
      }, [sessions, today]);

      // --- Add / Edit Word Handlers ---
      const openAddModal = () => {
        setEditingWord(null);
        setFormError('');
        setFormData({
          english: '',
          arabic: '',
          pronunciation: '',
          example: '',
          translation: '',
          category: '',
          notes: ''
        });
        setShowModal(true);
      };

      const openEditModal = (word) => {
        setEditingWord(word);
        setFormError('');
        setFormData({
          english: word.english || '',
          arabic: word.arabic || '',
          pronunciation: word.pronunciation || '',
          example: word.example || '',
          translation: word.translation || '',
          category: word.category || '',
          notes: word.notes || ''
        });
        setShowModal(true);
      };

      const handleSaveWord = async (e) => {
        e.preventDefault();
        const cleanEn = formData.english.trim();
        const cleanAr = formData.arabic.trim();

        if (!cleanEn || !cleanAr) {
          setFormError(settings.lang === 'ar' ? 'يرجى إدخال الكلمة الإنجليزية ومعناها بالعربية.' : 'Please enter both English word and Arabic meaning.');
          return;
        }

        // Prevent duplicate words
        const duplicate = vocab.find(
          w => w.english.toLowerCase() === cleanEn.toLowerCase() && (!editingWord || w.id !== editingWord.id)
        );
        if (duplicate) {
          setFormError(settings.lang === 'ar' ? 'هذه الكلمة موجودة مسبقاً في قاموسك!' : 'This word already exists in your vocabulary!');
          return;
        }

        const now = getTodayStr();
        const record = editingWord
          ? {
              ...editingWord,
              english: cleanEn,
              arabic: cleanAr,
              pronunciation: formData.pronunciation.trim(),
              example: formData.example.trim(),
              translation: formData.translation.trim(),
              category: formData.category.trim(),
              notes: formData.notes.trim()
            }
          : {
              id: Date.now().toString(),
              english: cleanEn,
              arabic: cleanAr,
              pronunciation: formData.pronunciation.trim(),
              example: formData.example.trim(),
              translation: formData.translation.trim(),
              category: formData.category.trim(),
              notes: formData.notes.trim(),
              status: 'new',
              interval: 0,
              dateCreated: now,
              lastReviewedDate: null,
              nextReviewDate: now
            };

        await dbPut('vocabulary', record);
        setVocab(prev =>
          editingWord ? prev.map(w => (w.id === record.id ? record : w)) : [record, ...prev]
        );
        setShowModal(false);
      };

      const handleDeleteWord = async (id) => {
        const msg = settings.lang === 'ar' ? 'هل أنت متأكد من حذف هذه الكلمة نهائياً؟' : 'Are you sure you want to delete this word?';
        if (!window.confirm(msg)) return;
        await dbDelete('vocabulary', id);
        setVocab(prev => prev.filter(w => w.id !== id));
        if (selectedWordDetail && selectedWordDetail.id === id) setSelectedWordDetail(null);
      };

      // --- Learn Session Logic ---
      const startLearnSession = () => {
        const target = Number(settings.dailyTarget) || 5;
        const candidates = vocab.filter(w => w.status === 'new' || w.status === 'difficult');
        const pool = candidates.length > 0 ? candidates : vocab;
        const selected = pool.slice(0, target);

        setLearnQueue(selected);
        setLearnIdx(0);
        setShowTranslation(false);
        setSessionResults([]);
        setSessionFinished(false);
        setActiveTab('learn');
      };

      const markLearnWord = async (choice) => {
        const current = learnQueue[learnIdx];
        if (!current) return;

        const now = getTodayStr();
        let nextInterval = 1;
        let newStatus = 'learned';

        if (choice === 'learned') {
          nextInterval = 1;
          newStatus = 'learned';
        } else if (choice === 'difficult') {
          nextInterval = 1;
          newStatus = 'difficult';
        } else {
          nextInterval = 0;
          newStatus = 'new';
        }

        const updatedWord = {
          ...current,
          status: newStatus,
          interval: nextInterval,
          lastReviewedDate: now,
          nextReviewDate: addDays(now, nextInterval)
        };

        await dbPut('vocabulary', updatedWord);
        setVocab(prev => prev.map(w => (w.id === updatedWord.id ? updatedWord : w)));

        const updatedResults = [...sessionResults, { word: current.english, choice }];
        setSessionResults(updatedResults);

        if (learnIdx + 1 < learnQueue.length) {
          setLearnIdx(learnIdx + 1);
          setShowTranslation(false);
        } else {
          const sessionRec = {
            id: Date.now().toString(),
            date: now,
            wordsCount: learnQueue.length,
            results: updatedResults
          };
          await dbPut('sessions', sessionRec);
          setSessions(prev => [...prev, sessionRec]);
          await recordActivityStreak();
          setSessionFinished(true);
        }
      };

      // --- Spaced Repetition Review Logic ---
      const startReviewSession = () => {
        setReviewIdx(0);
        setRevealAnswer(false);
        setReviewDone(false);
        setActiveTab('review');
      };

      const handleReviewGrade = async (grade) => {
        const current = dueWords[0]; // Always take first due word as list updates
        if (!current) return;

        const now = getTodayStr();
        const intervals = [1, 3, 7, 14, 30];
        const currInt = current.interval || 0;
        let nextInt = 1;
        let newStatus = current.status;

        if (grade === 'forgot') {
          nextInt = 1;
          newStatus = 'difficult';
        } else if (grade === 'hard') {
          nextInt = Math.max(1, currInt);
          newStatus = 'difficult';
        } else if (grade === 'good') {
          const idx = intervals.findIndex(x => x > currInt);
          nextInt = idx === -1 ? 30 : intervals[idx];
          newStatus = nextInt >= 14 ? 'mastered' : 'learned';
        } else if (grade === 'easy') {
          const idx = intervals.findIndex(x => x > currInt);
          const nextIdx = idx === -1 ? intervals.length - 1 : Math.min(intervals.length - 1, idx + 1);
          nextInt = intervals[nextIdx];
          newStatus = nextInt >= 14 ? 'mastered' : 'learned';
        }

        const updatedWord = {
          ...current,
          status: newStatus,
          interval: nextInt,
          lastReviewedDate: now,
          nextReviewDate: addDays(now, nextInt)
        };

        const reviewLog = {
          id: Date.now().toString(),
          wordId: current.id,
          english: current.english,
          grade,
          date: now,
          nextInterval: nextInt
        };

        await dbPut('vocabulary', updatedWord);
        await dbPut('reviews', reviewLog);
        await recordActivityStreak();

        setVocab(prev => prev.map(w => (w.id === updatedWord.id ? updatedWord : w)));
        setReviews(prev => [...prev, reviewLog]);
        setRevealAnswer(false);

        if (dueWords.length <= 1) {
          setReviewDone(true);
        }
      };

      // --- Export / Import / Backup ---
      const exportJSON = () => {
        const payload = { vocab, sessions, reviews, settings, exportedAt: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `wordly-backup-${getTodayStr()}.json`;
        a.click();
      };

      const exportCSV = () => {
        const headers = ['English', 'Arabic', 'Pronunciation', 'Example', 'Translation', 'Category', 'Status', 'DateCreated', 'NextReview'];
        const rows = vocab.map(w =>
          [w.english, w.arabic, w.pronunciation, w.example, w.translation, w.category, w.status, w.dateCreated, w.nextReviewDate]
            .map(v => `"${(v || '').replace(/"/g, '""')}"`)
            .join(',')
        );
        const csv = '\uFEFF' + [headers.join(','), ...rows].join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `wordly-vocabulary-${getTodayStr()}.csv`;
        a.click();
      };

      const handleImportFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const text = ev.target.result;
            if (file.name.endsWith('.json')) {
              const data = JSON.parse(text);
              if (Array.isArray(data.vocab)) {
                for (const item of data.vocab) {
                  await dbPut('vocabulary', item);
                }
                if (Array.isArray(data.sessions)) {
                  for (const s of data.sessions) await dbPut('sessions', s);
                }
                if (Array.isArray(data.reviews)) {
                  for (const r of data.reviews) await dbPut('reviews', r);
                }
                if (data.settings) {
                  await updateSettings(data.settings);
                }
                const allV = await dbGetAll('vocabulary');
                setVocab(allV);
                alert(settings.lang === 'ar' ? 'تم استيراد النسخة الاحتياطية بنجاح!' : 'Backup restored successfully!');
              }
            } else if (file.name.endsWith('.csv')) {
              const lines = text.split('\n').slice(1).filter(Boolean);
              const now = getTodayStr();
              for (const line of lines) {
                const cols = line.split(',').map(c => c.replace(/^"|"$/g, '').trim());
                if (cols[0] && cols[1]) {
                  const item = {
                    id: Date.now().toString() + Math.random().toString(36).slice(2, 6),
                    english: cols[0],
                    arabic: cols[1],
                    pronunciation: cols[2] || '',
                    example: cols[3] || '',
                    translation: cols[4] || '',
                    category: cols[5] || '',
                    notes: '',
                    status: cols[6] || 'new',
                    interval: 0,
                    dateCreated: cols[7] || now,
                    lastReviewedDate: null,
                    nextReviewDate: cols[8] || now
                  };
                  await dbPut('vocabulary', item);
                }
              }
              const allV = await dbGetAll('vocabulary');
              setVocab(allV);
              alert(settings.lang === 'ar' ? 'تم استيراد ملف CSV بنجاح!' : 'CSV imported successfully!');
            }
          } catch (err) {
            alert(settings.lang === 'ar' ? 'حدث خطأ أثناء قراءة الملف.' : 'Error reading file.');
          }
        };
        reader.readAsText(file);
      };

      // --- Filtered Vocabulary List ---
      const filteredVocab = useMemo(() => {
        return vocab
          .filter(w => {
            const q = searchQuery.toLowerCase();
            const matchesSearch =
              w.english.toLowerCase().includes(q) ||
              w.arabic.toLowerCase().includes(q) ||
              (w.category || '').toLowerCase().includes(q);
            if (!matchesSearch) return false;

            if (filterStatus === 'learned') return w.status === 'learned' || w.status === 'mastered';
            if (filterStatus === 'difficult') return w.status === 'difficult';
            if (filterStatus === 'new') return w.status === 'new';
            if (filterStatus === 'due') return w.nextReviewDate && w.nextReviewDate <= today;
            return true;
          })
          .sort((a, b) => {
            if (sortBy === 'alpha') return a.english.localeCompare(b.english);
            return Number(b.id) - Number(a.id);
          });
      }, [vocab, searchQuery, filterStatus, sortBy, today]);

      // Last 7 days chart data
      const last7DaysData = useMemo(() => {
        const days = [];
        for (let i = 6; i >= 0; i--) {
          const d = addDays(today, -i);
          const count =
            sessions.filter(s => s.date === d).reduce((a, b) => a + (b.wordsCount || 0), 0) +
            reviews.filter(r => r.date === d).length;
          days.push({ date: d.slice(5), count });
        }
        return days;
      }, [sessions, reviews, today]);

      const isAr = settings.lang === 'ar';

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-[#070B14] text-blue-400 text-lg font-bold">
            {isAr ? 'جاري تحميل قاعدة البيانات...' : 'Loading database...'}
          </div>
        );
      }

      const navItems = [
        { id: 'home', label: isAr ? 'الرئيسية' : 'Home', icon: '🏠' },
        { id: 'learn', label: isAr ? 'تعلّم' : 'Learn', icon: '📖' },
        { id: 'review', label: isAr ? 'المراجعة' : 'Review', icon: '🔄', badge: dueWords.length },
        { id: 'vocab', label: isAr ? 'كلماتي' : 'My Vocabulary', icon: '📚' },
        { id: 'stats', label: isAr ? 'الإحصائيات' : 'Statistics', icon: '📊' },
        { id: 'settings', label: isAr ? 'الإعدادات' : 'Settings', icon: '⚙️' }
      ];

      return (
        <div className="min-h-screen bg-[#070B14] text-slate-100 pb-24 md:pb-8">
          {/* Top Header */}
          <header className="sticky top-0 z-30 bg-[#0D1424]/95 backdrop-blur border-b border-slate-800 px-4 py-3">
            <div className="max-w-5xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2">
                <div className="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center font-black text-white text-lg shadow-lg shadow-blue-600/30">
                  W
                </div>
                <span className="text-xl font-extrabold tracking-wide text-white">WORDLY</span>
              </div>

              {/* Desktop Navigation */}
              <nav className="hidden md:flex items-center gap-1">
                {navItems.map(item => (
                  <button
                    key={item.id}
                    onClick={() => {
                      if (item.id === 'learn' && learnQueue.length === 0) startLearnSession();
                      else setActiveTab(item.id);
                    }}
                    className={`px-3 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-1.5 ${
                      activeTab === item.id
                        ? 'bg-blue-600 text-white shadow-md shadow-blue-600/25'
                        : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                    }`}
                  >
                    <span>{item.icon}</span>
                    <span>{item.label}</span>
                    {item.badge > 0 && (
                      <span className="bg-rose-500 text-white text-xs px-1.5 py-0.5 rounded-full">
                        {item.badge}
                      </span>
                    )}
                  </button>
                ))}
              </nav>

              <button
                onClick={openAddModal}
                className="bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold px-3.5 py-2 rounded-xl shadow-lg shadow-blue-600/25 transition"
              >
                + {isAr ? 'إضافة كلمة' : 'Add Word'}
              </button>
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-4xl mx-auto p-4 md:p-6">
            {/* 1. HOME TAB */}
            {activeTab === 'home' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-l from-blue-900/40 via-[#0D1424] to-[#0D1424] border border-blue-800/40 rounded-2xl p-6">
                  <h1 className="text-2xl font-bold text-white mb-1">
                    {isAr ? 'مرحباً بك في WORDLY' : 'Welcome to WORDLY'}
                  </h1>
                  <p className="text-slate-400 text-sm">
                    {isAr
                      ? 'ابنِ حصيلتك اللغوية الإنجليزية خطوة بخطوة مع نظام التكرار المتباعد.'
                      : 'Build your English vocabulary step by step with spaced repetition.'}
                  </p>

                  <div className="mt-5 flex flex-wrap gap-3">
                    <button
                      onClick={startLearnSession}
                      className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-3 rounded-xl shadow-lg shadow-blue-600/30 transition flex items-center gap-2"
                    >
                      <span>⚡</span>
                      <span>{isAr ? 'ابدأ جلسة تعلّم (5 دقائق)' : 'Start 5-Min Learning Session'}</span>
                    </button>

                    <button
                      onClick={startReviewSession}
                      className="bg-slate-800 hover:bg-slate-700 text-white font-bold px-5 py-3 rounded-xl border border-slate-700 transition flex items-center gap-2"
                    >
                      <span>🔄</span>
                      <span>
                        {isAr ? `مراجعة الكلمات المستحقة (${dueWords.length})` : `Review Due Words (${dueWords.length})`}
                      </span>
                    </button>
                  </div>
                </div>

                {/* Stats Cards */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-3.5">
                  <div className="bg-[#0D1424] border border-slate-800 rounded-2xl p-4">

                    <div className="text-sm text-white" dir="ltr">"{selectedWordDetail.example}"</div>
                    {selectedWordDetail.translation && (
                      <div className="text-xs text-slate-400">{selectedWordDetail.translation}</div>
                    )}
                  </div>
                )}

                {selectedWordDetail.notes && (
                  <div className="text-xs text-slate-300 bg-slate-900/60 p-3 rounded-xl">
                    <span className="font-bold text-blue-400">{isAr ? 'ملاحظات: ' : 'Notes: '}</span>
                    {selectedWordDetail.notes}
                  </div>
                )}

                <div className="text-xs text-slate-500 flex justify-between pt-2 border-t border-slate-800">
                  <span>{isAr ? `أضيفت: ${selectedWordDetail.dateCreated}` : `Added: ${selectedWordDetail.dateCreated}`}</span>
                  <span>{isAr ? `المراجعة: ${selectedWordDetail.nextReviewDate}` : `Review: ${selectedWordDetail.nextReviewDate}`}</span>
                </div>
              </div>
            </div>
          )}

          {/* Add / Edit Word Modal */}
          {showModal && (
            <div className="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4 overflow-y-auto">
              <form
                onSubmit={handleSaveWord}
                className="bg-[#0D1424] border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-3.5 my-8"
              >
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold text-white">
                    {editingWord ? (isAr ? 'تعديل الكلمة' : 'Edit Word') : (isAr ? 'إضافة كلمة إنجليزية جديدة' : 'Add New English Word')}
                  </h3>
                  <button type="button" onClick={() => setShowModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                {formError && (
                  <div className="bg-rose-950/80 border border-rose-700 text-rose-300 text-xs p-3 rounded-xl">
                    {formError}
                  </div>
                )}

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">{isAr ? 'الكلمة الإنجليزية *' : 'English Word *'}</label>
                    <input
                      type="text"
                      dir="ltr"
                      value={formData.english}
                      onChange={(e) => setFormData({ ...formData, english: e.target.value })}
                      placeholder="e.g. Resilient"
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">{isAr ? 'المعنى بالعربية *' : 'Arabic Meaning *'}</label>
                    <input
                      type="text"
                      value={formData.arabic}
                      onChange={(e) => setFormData({ ...formData, arabic: e.target.value })}
                      placeholder="مثال: مرن / صامد"
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">{isAr ? 'النطق الصوتي (اختياري)' : 'Pronunciation (Optional)'}</label>
                    <input
                      type="text"
                      dir="ltr"
                      value={formData.pronunciation}
                      onChange={(e) => setFormData({ ...formData, pronunciation: e.target.value })}
                      placeholder="rɪˈzɪliənt"
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-slate-400 mb-1">{isAr ? 'التصنيف (اختياري)' : 'Category (Optional)'}</label>
                    <input
                      type="text"
                      value={formData.category}
                      onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                      placeholder={isAr ? 'مثال: صفات، عمل، سفر' : 'e.g. Adjectives, Work'}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs text-slate-400 mb-1">{isAr ? 'جملة مثال بالإنجليزية (اختياري)' : 'Example Sentence (Optional)'}</label>
                  <input
                    type="text"
                    dir="ltr"
                    value={formData.example}
                    onChange={(e) => setFormData({ ...formData, example: e.target.value })}
                    placeholder="She is resilient in the face of challenges."
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white"
                  />
                </div>

                <div>
                  <label className="block text-xs text-slate-400 mb-1">{isAr ? 'ترجمة المثال بالعربية (اختياري)' : 'Arabic Example Translation (Optional)'}</label>
                  <input
                    type="text"
                    value={formData.translation}
                    onChange={(e) => setFormData({ ...formData, translation: e.target.value })}
                    placeholder="هي صامدة في مواجهة التحديات."
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white"
                  />
                </div>

                <div>
                  <label className="block text-xs text-slate-400 mb-1">{isAr ? 'ملاحظات إضافية (اختياري)' : 'Notes (Optional)'}</label>
                  <textarea
                    rows="2"
                    value={formData.notes}
                    onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white"
                  />
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button
                    type="button"
                    onClick={() => setShowModal(false)}
                    className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-sm font-bold"
                  >
                    {isAr ? 'إلغاء' : 'Cancel'}
                  </button>
                  <button
                    type="submit"
                    className="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold"
                  >
                    {isAr ? 'حفظ الكلمة' : 'Save Word'}
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* Mobile Bottom Navigation */}
          <nav className="md:hidden fixed bottom-0 inset-x-0 z-30 bg-[#0D1424]/95 backdrop-blur border-t border-slate-800 grid grid-cols-6 py-1.5">
            {navItems.map(item => (
              <button
                key={item.id}
                onClick={() => {
                  if (item.id === 'learn' && learnQueue.length === 0) startLearnSession();
                  else setActiveTab(item.id);
                }}
                className={`flex flex-col items-center justify-center py-1 relative ${
                  activeTab === item.id ? 'text-blue-400' : 'text-slate-400'
                }`}
              >
                <span className="text-lg">{item.icon}</span>
                <span className="text-[10px] font-bold mt-0.5">{item.label}</span>
                {item.badge > 0 && (
                  <span className="absolute top-0.5 right-3 bg-rose-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center">
                    {item.badge}
                  </span>
                )}
              </button>
            ))}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
